[package]
name = "c-polars"
# Source of truth for the published libpolars version: the release workflow reads this to name the
# tag, the tarballs, and the Artifacts.toml URLs. Bump it in the PR that changes the C ABI.
version = "0.6.0"
edition = "2021"

[lib]
name = "polars"
crate-type = ["cdylib"]

[features]
# Opt-in only: to_titlecase needs a nightly rustc, which the rust-toolchain pin deliberately avoids.
nightly = ["polars-plan/nightly"]

[dependencies]
either = "1"
polars-core = "0.55.2"
polars-plan = "0.55.2"
polars-compute = "0.55.2"
polars-utils = "0.55.2"
# `dtype-time` is not implied by polars' defaults and polars-ops does not get it transitively.
# Without it, `take_chunked_unchecked`'s Time arm compiles out to `unreachable!()` and any
# join/gather over a Time column aborts the process. Keep it explicit.
polars-ops = { version = "0.55.2", features = ["round_series", "dtype-time"] }
# `aws`/`gcp`/`azure` are the only cloud features listed here: `cloud`, `async`, `file_cache` and
# `http` are already active transitively via this crate's `lazy`/`streaming`, as is
# `dtype-categorical`. Do not add them back -- they would be dead weight, not a fix. Check with
# `cargo tree -e features -i <crate>`, which is the source of truth, not this list.
# `list_sets`/`list_count`/`list_gather`/`list_drop_nulls`/`list_sample`/`list_to_struct`:
# `ListNameSpace` set ops/count_matches/gather(_every)/drop_nulls/sample_n(_fraction)/to_struct.
# `dtype-array`: `list.to_array`. `concat_str`: string `join`. `extract_groups`: named-capture
# regex into a Struct. `json`: `struct.json_encode`. `is_first_distinct`/`is_last_distinct`: the
# dedicated dedup flags.
# `range`: int_range/date_range/datetime_range/time_range
polars = { version = "0.55.2", features = ["parquet", "lazy", "performant", "trigonometry", "abs", "round_series", "strings", "regex", "dynamic_group_by", "product", "propagate_nans", "is_in", "offset_by", "string_pad", "cum_agg", "diff", "rank", "pct_change", "semi_anti_join", "cross_join", "asof_join", "log", "sign", "dtype-decimal", "replace", "pivot", "top_k", "is_unique", "random", "ipc", "interpolate", "timezones", "decompress", "dtype-time", "meta", "dtype-duration", "aws", "gcp", "azure", "rolling_window", "moment", "is_between", "rle", "cov", "ewma", "cutqcut", "list_sets", "list_count", "list_gather", "list_drop_nulls", "list_sample", "list_to_struct", "dtype-array", "concat_str", "extract_groups", "json", "is_first_distinct", "is_last_distinct", "range"] }

# Optimize the vendored polars kernels even in dev: at the default opt-level 0, every dev/test/CI
# run executes unoptimized kernels, which invalidates any live timing impression. This crate's own
# FFI shim stays unoptimized so header/binding-only changes still rebuild fast.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Distribution artifacts only, not the dev loop (gen/prologue.jl prefers target/release when it
# exists, else target/debug). codegen-units = 1 + thin LTO trades build time and memory for
# inlining into polars kernels; drop codegen-units to 4 if linking OOMs. `strip = "symbols"` drops
# debug info and the local symbol table in one pass -- exported symbols must survive, which the
# release workflow's parity check enforces.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
