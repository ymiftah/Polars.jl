name: Release libpolars

# Builds the native library for every supported platform, publishes the tarballs as GitHub Release
# assets, and rewrites the root Artifacts.toml to point at them. This repo does NOT use the
# registered libpolars_jll: that JLL is built from the original upstream repo and exports far
# fewer symbols than this fork needs, so it fails at ccall time for anyone installing from git.
#
# Manual trigger only. The version comes from c-polars/Cargo.toml -- bump it in the PR that changes
# the C ABI, merge, then run this workflow. Release procedure in docs/src/developer.md.
#
# Any change under c-polars/ is invisible to outside users until this runs. The `artifact` job in
# Tests.yml is what catches that drift.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            runner: ubuntu-22.04
            # ubuntu runners are 4 vCPU / 16 GB.
            build-jobs: 4
          - target: aarch64-apple-darwin
            runner: macos-14
            # macos-14 is 3 vCPU / 7 GB -- the tightest box in the matrix, and the one most likely
            # to OOM under codegen-units = 1. Drop to 1 if this row gets killed.
            build-jobs: 2

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./c-polars"
          # Deliberately NOT the "c-polars" key used by Tests.yml: that cache holds dev-profile
          # artifacts, and release/dev profiles share nothing. Keeping them separate stops the two
          # from evicting each other.
          shared-key: "c-polars-release"

      - name: Report runner resources
        run: |
          echo "runner: ${{ matrix.runner }} / build-jobs: ${{ matrix.build-jobs }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            sysctl -n hw.ncpu hw.memsize
            df -h /
          else
            nproc
            free -g
            df -h /
          fi

      - name: Build libpolars (release)
        run: cargo build --release --verbose
        working-directory: ./c-polars
        env:
          CARGO_BUILD_JOBS: ${{ matrix.build-jobs }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Stage into JLL layout
        run: |
          set -euo pipefail
          mkdir -p staging/lib
          if [ -f c-polars/target/release/libpolars.so ]; then
            cp c-polars/target/release/libpolars.so staging/lib/
          elif [ -f c-polars/target/release/libpolars.dylib ]; then
            cp c-polars/target/release/libpolars.dylib staging/lib/
            # JLL convention. We dlopen by absolute path so this is not load-bearing today, but it
            # keeps the tarball drop-in compatible with a future Yggdrasil-built libpolars_jll.
            install_name_tool -id @rpath/libpolars.dylib staging/lib/libpolars.dylib
          else
            echo "::error::no built library found in c-polars/target/release/"
            ls -la c-polars/target/release/ || true
            exit 1
          fi

      - name: Symbol parity check
        # The dynamic symbol table IS the product: `strip = "symbols"` must drop only debug and
        # local symbols, and `#[no_mangle] extern "C"` must survive thin LTO. A silent shortfall
        # here is the failure that made the stale registered libpolars_jll useless.
        #
        # Delegates to check_header_drift.py rather than counting symbols inline -- it derives the
        # expected set from include/polars.h, handles the macOS underscore prefix, and exempts
        # #[cfg]-gated symbols. An inline count has to be edited every time the ABI grows, and
        # silently blocks a release when it isn't.
        run: python3 c-polars/check_header_drift.py --lib "$(ls staging/lib/libpolars.*)"

      - name: Package
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' c-polars/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "c-polars version: $version"
          tar -czf "libpolars.v${version}.${{ matrix.target }}.tar.gz" -C staging .

      - name: Report artifact sizes
        # Phase 1 exists partly to replace guesswork here: every size figure in the plan so far is
        # extrapolated from the 240 MB *debug* build.
        run: |
          set -euo pipefail
          echo "--- stripped library ---"
          ls -l staging/lib/
          echo "--- tarball ---"
          ls -l libpolars.v*.tar.gz
          {
            echo "### ${{ matrix.target }}"
            echo ""
            echo '```'
            du -h staging/lib/* libpolars.v*.tar.gz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: libpolars-${{ matrix.target }}
          path: libpolars.v*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      # Creating the release only. This job deliberately does NOT write to the repo -- see the
      # "Upload Artifacts.toml for the maintainer to commit" step at the end for why.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Flatten the per-target upload names back into one directory of tarballs.
          merge-multiple: true

      - name: Resolve version from c-polars/Cargo.toml
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' c-polars/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "releasing libpolars v$version"
          ls -l dist/

      - name: Verify every tarball carries that version
        # Guards against a half-updated matrix silently publishing a stale target.
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do
            case "$(basename "$f")" in
              "libpolars.v${VERSION}."*) ;;
              *) echo "::error::$(basename "$f") does not match libpolars.v${VERSION}.*"; exit 1 ;;
            esac
          done

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: libpolars-v${{ env.VERSION }}
          name: libpolars v${{ env.VERSION }}
          body: |
            Native `libpolars` build for Polars.jl, produced from `c-polars/` at this commit.

            Consumed via the root `Artifacts.toml` — not a Julia package, and not the registered
            `libpolars_jll`. Nothing here needs to be downloaded by hand.
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - name: Regenerate Artifacts.toml
        # Deliberately after the release exists. The download URLs are deterministic from the tag,
        # so the ordering is not strictly forced -- but committing hashes for assets that failed to
        # upload would be worse than the reverse.
        run: julia .github/scripts/update_artifacts_toml.jl "$VERSION" dist Artifacts.toml

      - name: Upload Artifacts.toml for the maintainer to commit
        # This job does not commit Artifacts.toml itself, for two compounding reasons:
        #
        #   1. `main` is protected -- 1 approving review, code-owner review required, and
        #      enforce_admins is off. github-actions[bot] is not an admin, so a direct
        #      `git push origin HEAD:main` is rejected outright.
        #   2. The usual escape hatch, having CI open a PR, does not work here either: events
        #      raised with GITHUB_TOKEN do not trigger workflows, so `test (ubuntu-latest, 1)`
        #      -- a *required* status check -- would never run and the PR would be permanently
        #      unmergeable. Fixing that needs a PAT secret purely to launder the token identity.
        #
        # Branch protection already puts a human in the loop, so the file is handed back instead.
        # It is printed to the job summary for copy-paste and uploaded for download.
        run: |
          set -euo pipefail
          {
            echo "## Artifacts.toml for libpolars v${VERSION}"
            echo ""
            echo "Commit this at the repo root (it is generated, not hand-edited):"
            echo ""
            echo '```toml'
            cat Artifacts.toml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts.toml
          path: Artifacts.toml
          if-no-files-found: error
