name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: "ubuntu-latest"
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'c-polars/**'
              - '.github/workflows/Tests.yml'

  lint:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Run pre-commit
        run: uvx --with "pre-commit>=4.1.0" pre-commit run --all-files

      - name: Check the C header matches the Rust FFI surface
        run: python3 c-polars/check_header_drift.py

      - name: Check the Arrow C Data Interface structs match their Julia mirrors
        run: python3 c-polars/check_header_drift.py --arrow

      - name: Check generated API bindings are up to date
        run: |
          julia --project=gen -e 'import Pkg; Pkg.instantiate()'
          julia --project=gen gen/generate.jl
          uvx --with "pre-commit>=4.1.0" pre-commit run runic --files src/api/generated.jl || true
          git diff --exit-code -- src/api/generated.jl

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./c-polars"
          shared-key: "c-polars"
      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.0 --locked
      - name: Check include/polars.h is up to date
        run: |
          uv tool install clang-format==22.1.8
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          export PATH="$(uv tool dir --bin):$PATH"
          ./regen_header.sh
          git diff --exit-code -- include/polars.h
        working-directory: ./c-polars
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: ./c-polars
      - name: Rustfmt
        run: cargo fmt --check
        working-directory: ./c-polars
      - name: Install llvm-tools component
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Rust smoke tests (C ABI safety) with coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
        working-directory: ./c-polars
      - uses: codecov/codecov-action@v5
        with:
          files: c-polars/lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        julia-version: ["1.10", "1"]

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./c-polars"
          shared-key: "c-polars"
      - name: Build libpolars
        run: cargo build --verbose
        working-directory: ./c-polars
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v5
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          flags: julia
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  artifact:
    # Exercises the path outside users actually take: the prebuilt libpolars from Artifacts.toml,
    # with NO local cargo build. Every other job builds c-polars first, so the local override in
    # gen/prologue.jl always wins and the shipped binary is never touched -- which is exactly how
    # the registered libpolars_jll stayed broken for so long without any job noticing.
    #
    # Push-only, deliberately. Artifacts.toml pins a fixed release tag, so a commit that changes
    # c-polars/ without a matching release will fail this job. That is correct signal, but it must
    # not block merging the PR that makes the change -- the release can only be cut after it lands.
    # Expect main to be briefly red between such a merge and the release; see
    # plans/jll_distribution.md.
    runs-on: "ubuntu-22.04"
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2

      # Note: no `cargo build` step. That omission is the entire point of this job.

      - name: Download the artifact
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'

      - name: Resolve libpolars and check symbol coverage
        run: |
          set -euo pipefail
          lib=$(julia --project=. -e 'using Polars; print(Polars.API.libpolars)')
          echo "resolved libpolars -> $lib"
          case "$lib" in
            *"/artifacts/"*) ;;
            *) echo "::error::expected resolution to an installed artifact, got $lib"; exit 1 ;;
          esac
          python3 c-polars/check_header_drift.py --lib "$lib"

      - uses: julia-actions/julia-runtest@v1

  docs:
    runs-on: "ubuntu-latest"
    needs: test

    # Runs on both push (to main) and pull_request (the workflow-level `on:` above already scopes
    # both), unlike previously push-only: `deploydocs` only pushes to gh-pages when running on
    # `devbranch` via a push event, so a PR run builds (and so validates) the docs but never
    # deploys -- the standard, documented-safe Documenter.jl CI pattern. Push-only meant a
    # doc-breaking PR was invisible until after merge, which is exactly what happened here.
    # This job needs permission to push the built site to the gh-pages branch.
    permissions:
      contents: write
      pages: write
      id-token: write
      statuses: write

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./c-polars"
          shared-key: "c-polars"
      - name: Build libpolars
        run: cargo build --verbose
        working-directory: ./c-polars
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Build and deploy docs
        uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          JULIA_DEBUG: "Documenter"
